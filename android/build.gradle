def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def findReactNativeVersion() {
  def directory = rootProject.projectDir
  while (directory != null) {
    def packageJson = new File(directory, "node_modules/react-native/package.json")
    if (packageJson.exists()) {
      return new groovy.json.JsonSlurper().parseText(packageJson.text).version as String
    }
    directory = directory.parentFile
  }
  return null
}

apply plugin: "com.android.library"
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: "org.jetbrains.kotlin.android"
}

def reactNativeVersion = findReactNativeVersion()
def reactNativeMinor = reactNativeVersion == null ? -1 : reactNativeVersion.tokenize('.')[1].toInteger()
def hostRequestedNewArchitecture =
  rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
def useNewArchitecture = hostRequestedNewArchitecture || reactNativeMinor >= 82

if (useNewArchitecture) {
  apply plugin: "com.facebook.react"
}

def getExtOrIntegerDefault(name, fallback) {
  if (rootProject.ext.has(name)) {
    return rootProject.ext.get(name)
  }
  def property = project.properties["WalletKit_" + name]
  return property == null ? fallback : property.toInteger()
}

android {
  namespace "com.azizuysal.walletkit"

  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion", 36)

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion", 36)
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  sourceSets {
    // Built-in Kotlin does not read java.srcDirs for Kotlin sources, so these
    // directories have to be registered through main.kotlin or their .kt files
    // are dropped from compileDebugKotlin without an error.
    main.kotlin.srcDir(
      useNewArchitecture ? "src/newarch/java" : "src/legacy/java"
    )

    if (useNewArchitecture) {
      main.kotlin.srcDir(
        reactNativeMinor >= 85 ? "src/rn85plus/java" : "src/rn84minus/java"
      )
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

// The android.kotlinOptions block is gone under built-in Kotlin, where it fails
// with "Could not find method kotlinOptions()". The compilerOptions API is
// available from Kotlin 1.9.25, so this works on the older toolchains too.
kotlin {
  compilerOptions {
    jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "com.google.android.gms:play-services-pay:16.5.0"
  testImplementation "junit:junit:4.13.2"
}
