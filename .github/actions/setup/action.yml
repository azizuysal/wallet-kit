name: Setup
description: Set up Node.js and perform an immutable Yarn install

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc

    - name: Enable Corepack
      run: corepack enable
      shell: bash

    - name: Cache Yarn artifacts
      uses: actions/cache@v5
      with:
        path: |
          .yarn/cache
          .yarn/install-state.gz
        key: ${{ runner.os }}-yarn-4.18.0-${{ hashFiles('yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-4.18.0-

    - name: Install dependencies
      run: corepack yarn install --immutable
      shell: bash

    - name: Verify package executables
      run: test -x node_modules/.bin/bob && test -x node_modules/.bin/jest && test -x node_modules/.bin/react-native
      shell: bash
