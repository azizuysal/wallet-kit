name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  compatibility:
    name: Full compatibility gate
    uses: ./.github/workflows/compatibility.yml
    with:
      full-matrix: true

  security:
    name: Security gate
    uses: ./.github/workflows/security.yml
    secrets: inherit

  publish:
    name: Publish npm package, then GitHub release
    needs: [compatibility, security]
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Run final package checks
        run: corepack yarn verify

      - name: Prepare curated GitHub release notes
        run: node scripts/extract-release-notes.js CHANGELOG.md "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/release-notes.md"

      - name: Configure npm registry
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish package with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub release after npm succeeds
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
