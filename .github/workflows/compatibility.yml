name: Native compatibility

on:
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      full-matrix:
        description: Test every supported React Native minor
        type: boolean
        default: true
  workflow_call:
    inputs:
      full-matrix:
        description: Test every supported React Native minor
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  matrix:
    name: Build compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      cells: ${{ steps.matrix.outputs.cells }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate matrix from compatibility manifest
        id: matrix
        env:
          MATRIX_MODE: ${{ (inputs.full-matrix || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'full' || 'pr' }}
        run: echo "cells=$(node scripts/compatibility-matrix.mjs --mode "$MATRIX_MODE")" >> "$GITHUB_OUTPUT"

  package:
    name: Build consumer tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build and validate package
        run: |
          corepack yarn prepare
          corepack yarn validate:package
          npm pack --ignore-scripts --json > "$RUNNER_TEMP/npm-pack.json"
          node -e "const fs=require('fs'); const result=JSON.parse(fs.readFileSync(process.argv[1],'utf8'))[0]; fs.copyFileSync(result.filename, process.argv[2] + '/' + result.filename);" "$RUNNER_TEMP/npm-pack.json" "$RUNNER_TEMP"

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: wallet-kit-package
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 2

  android:
    name: Android RN ${{ matrix.rn }} ${{ matrix.architecture }}
    needs: [matrix, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cells) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Download package tarball
        uses: actions/download-artifact@v5
        with:
          name: wallet-kit-package
          path: ${{ runner.temp }}/wallet-kit-package

      - name: Prepare packed-package consumer
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-android-${{ matrix.rn }}-${{ matrix.architecture }}
          ARCHITECTURE: ${{ matrix.architecture }}
          REACT_NATIVE_VERSION: ${{ matrix.rn }}
          REACT_VERSION: ${{ matrix.react }}
        run: |
          mkdir -p "$APP_DIR"
          rsync -a --exclude /android --exclude /ios --exclude /node_modules --exclude /dist example/ "$APP_DIR/"
          TARBALL=$(find "$RUNNER_TEMP/wallet-kit-package" -maxdepth 1 -name '*.tgz' -print -quit)
          node scripts/prepare-compatibility-app.mjs --app "$APP_DIR" --tarball "$TARBALL" --react-native "$REACT_NATIVE_VERSION" --react "$REACT_VERSION" --architecture "$ARCHITECTURE" --native-tests false
          cd "$APP_DIR"
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable
          yarn build:android
          yarn configure --force --platforms android
          cd "$GITHUB_WORKSPACE"
          node scripts/prepare-compatibility-app.mjs --app "$APP_DIR" --tarball "$TARBALL" --react-native "$REACT_NATIVE_VERSION" --react "$REACT_VERSION" --architecture "$ARCHITECTURE" --native-tests false

      - name: Run Android native tests and Debug build
        working-directory: ${{ runner.temp }}/wallet-kit-android-${{ matrix.rn }}-${{ matrix.architecture }}/android
        run: ./gradlew :azizuysal_wallet-kit:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Build Android Release
        if: matrix.release
        working-directory: ${{ runner.temp }}/wallet-kit-android-${{ matrix.rn }}-${{ matrix.architecture }}/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Enable KVM group permissions
        if: matrix.rn == '0.86.2' && matrix.architecture == 'new'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch current stable app and exercise native button
        if: matrix.rn == '0.86.2' && matrix.architecture == 'new'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          working-directory: ${{ runner.temp }}/wallet-kit-android-${{ matrix.rn }}-${{ matrix.architecture }}/android
          script: |
            ./gradlew :app:installRelease -PreactNativeArchitectures=x86_64 --stacktrace
            adb shell am start -W -n com.azizuysal.walletkit.example/com.microsoft.reacttestapp.MainActivity
            node "$GITHUB_WORKSPACE/scripts/android-smoke.mjs"

      - name: Upload Android smoke evidence
        if: matrix.rn == '0.86.2' && matrix.architecture == 'new' && success()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-${{ matrix.rn }}-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/wallet-kit-*.xml
            ${{ runner.temp }}/wallet-kit-android.png
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS RN ${{ matrix.rn }} ${{ matrix.architecture }}
    needs: [matrix, package]
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.cells) }}
    env:
      RCT_NEW_ARCH_ENABLED: ${{ matrix.architecture == 'new' && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Download package tarball
        uses: actions/download-artifact@v5
        with:
          name: wallet-kit-package
          path: ${{ runner.temp }}/wallet-kit-package

      - name: Prepare packed-package consumer
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-ios-${{ matrix.rn }}-${{ matrix.architecture }}
          ARCHITECTURE: ${{ matrix.architecture }}
          REACT_NATIVE_VERSION: ${{ matrix.rn }}
          REACT_VERSION: ${{ matrix.react }}
          NATIVE_TESTS: ${{ matrix.nativeTests }}
        run: |
          mkdir -p "$APP_DIR"
          rsync -a --exclude /android --exclude /ios --exclude /node_modules --exclude /dist example/ "$APP_DIR/"
          TARBALL=$(find "$RUNNER_TEMP/wallet-kit-package" -maxdepth 1 -name '*.tgz' -print -quit)
          node scripts/prepare-compatibility-app.mjs --app "$APP_DIR" --tarball "$TARBALL" --react-native "$REACT_NATIVE_VERSION" --react "$REACT_VERSION" --architecture "$ARCHITECTURE" --native-tests false
          cd "$APP_DIR"
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn install
          yarn install --immutable
          yarn build:ios
          yarn configure --force --platforms ios
          cd "$GITHUB_WORKSPACE"
          node scripts/prepare-compatibility-app.mjs --app "$APP_DIR" --tarball "$TARBALL" --react-native "$REACT_NATIVE_VERSION" --react "$REACT_VERSION" --architecture "$ARCHITECTURE" --native-tests "$NATIVE_TESTS"
          cd "$APP_DIR"
          BUNDLE_FROZEN=true bundle install --jobs 4
          bundle exec pod install --project-directory=ios

      - name: Build iOS Debug
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-ios-${{ matrix.rn }}-${{ matrix.architecture }}
        run: xcodebuild -workspace "$APP_DIR/ios/WalletKitExample.xcworkspace" -scheme ReactTestApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.rn }}-${{ matrix.architecture }}" CODE_SIGNING_ALLOWED=NO build

      - name: Build iOS Release
        if: matrix.release
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-ios-${{ matrix.rn }}-${{ matrix.architecture }}
        run: xcodebuild -workspace "$APP_DIR/ios/WalletKitExample.xcworkspace" -scheme ReactTestApp -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData-${{ matrix.rn }}-${{ matrix.architecture }}" CODE_SIGNING_ALLOWED=NO build

      - name: Run iOS native tests
        if: matrix.nativeTests
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-ios-${{ matrix.rn }}-${{ matrix.architecture }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | node -e "let source=''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => { const runtimes=Object.values(JSON.parse(source).devices); const device=runtimes.flat().find(value => value.isAvailable && value.name.startsWith('iPhone')); if (!device) process.exit(1); process.stdout.write(device.udid); });")
          xcrun simctl boot "$DEVICE_ID" || test $? -eq 149
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild test -workspace "$APP_DIR/ios/WalletKitExample.xcworkspace" -scheme ReactTestApp -only-testing:ReactTestAppTests -destination "id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData-tests-${{ matrix.rn }}-${{ matrix.architecture }}" CODE_SIGNING_ALLOWED=NO

      - name: Launch current stable iOS app
        if: matrix.rn == '0.86.2' && matrix.architecture == 'new'
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-ios-${{ matrix.rn }}-${{ matrix.architecture }}
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | node -e "let source=''; process.stdin.on('data', chunk => source += chunk); process.stdin.on('end', () => { const runtimes=Object.values(JSON.parse(source).devices); const device=runtimes.flat().find(value => value.isAvailable && value.name.startsWith('iPhone')); if (!device) process.exit(1); process.stdout.write(device.udid); });")
          xcrun simctl boot "$DEVICE_ID" || test $? -eq 149
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData-${{ matrix.rn }}-${{ matrix.architecture }}/Build/Products/Release-iphonesimulator" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"
          sleep 10
          DATA_CONTAINER=$(xcrun simctl get_app_container "$DEVICE_ID" "$BUNDLE_ID" data)
          grep -qx 'invalid input rejected' "$DATA_CONTAINER/Documents/wallet-kit-smoke.txt"
          xcrun simctl spawn "$DEVICE_ID" log show --last 2m --style compact --predicate "process == 'ReactTestApp'" > "$RUNNER_TEMP/wallet-kit-ios.log"
          if grep -E "doesn't seem to be linked|Unhandled JS Exception|Fatal error" "$RUNNER_TEMP/wallet-kit-ios.log"; then exit 1; fi
          xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/wallet-kit-ios.png"

      - name: Upload iOS smoke evidence
        if: matrix.rn == '0.86.2' && matrix.architecture == 'new' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-${{ matrix.rn }}-${{ matrix.architecture }}
          path: |
            ${{ runner.temp }}/wallet-kit-ios.log
            ${{ runner.temp }}/wallet-kit-ios.png
          if-no-files-found: error
          retention-days: 7

  next:
    name: Non-blocking ${{ matrix.platform }} react-native@next
    if: github.event_name == 'schedule'
    continue-on-error: true
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    runs-on: ${{ matrix.os }}
    env:
      RCT_NEW_ARCH_ENABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Setup Java
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: matrix.platform == 'android'
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Ruby
        if: matrix.platform == 'ios'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Download package tarball
        uses: actions/download-artifact@v5
        with:
          name: wallet-kit-package
          path: ${{ runner.temp }}/wallet-kit-package

      - name: Resolve next versions and prepare consumer
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-next-${{ matrix.platform }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          REACT_NATIVE_VERSION=$(npm view react-native@next version)
          REACT_VERSION=$(npm view react-native@next peerDependencies.react)
          mkdir -p "$APP_DIR"
          rsync -a --exclude android --exclude ios --exclude node_modules --exclude dist example/ "$APP_DIR/"
          TARBALL=$(find "$RUNNER_TEMP/wallet-kit-package" -maxdepth 1 -name '*.tgz' -print -quit)
          node scripts/prepare-compatibility-app.mjs --app "$APP_DIR" --tarball "$TARBALL" --react-native "$REACT_NATIVE_VERSION" --react "$REACT_VERSION" --architecture new --native-tests false
          cd "$APP_DIR"
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install
          yarn install --immutable
          yarn configure --force --platforms "$PLATFORM"
          cd "$GITHUB_WORKSPACE"
          node scripts/prepare-compatibility-app.mjs --app "$APP_DIR" --tarball "$TARBALL" --react-native "$REACT_NATIVE_VERSION" --react "$REACT_VERSION" --architecture new --native-tests false

      - name: Build Android Debug
        if: matrix.platform == 'android'
        working-directory: ${{ runner.temp }}/wallet-kit-next-android/android
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --stacktrace

      - name: Install pods and build iOS Debug
        if: matrix.platform == 'ios'
        env:
          APP_DIR: ${{ runner.temp }}/wallet-kit-next-ios
        run: |
          cd "$APP_DIR"
          BUNDLE_FROZEN=true bundle install --jobs 4
          bundle exec pod install --project-directory=ios
          xcodebuild -workspace "$APP_DIR/ios/WalletKitExample.xcworkspace" -scheme ReactTestApp -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
