name: Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    types:
      - checks_requested
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  workflow_call:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  dependency-audit:
    name: Yarn audit and secret/package scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Audit the immutable Yarn dependency graph
        run: corepack yarn npm audit --recursive --environment production --severity high

      - name: Scan tracked and packed files for credentials
        run: |
          corepack yarn prepare
          corepack yarn validate:secrets
          corepack yarn validate:package

  osv-pr:
    name: OSV new-vulnerability gate
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write

  osv-full:
    name: OSV high/critical gate
    if: github.event_name != 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --min-severity=7.0
        --recursive
        ./
    permissions:
      actions: read
      contents: read
      security-events: write

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  snyk:
    name: Snyk when configured
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup
        uses: ./.github/actions/setup

      - name: Explain skipped Snyk scan
        if: env.SNYK_TOKEN == ''
        run: echo 'Snyk skipped because SNYK_TOKEN is not configured.'

      - name: Run Snyk high-severity gate
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@v1
        env:
          SNYK_TOKEN: ${{ env.SNYK_TOKEN }}
        with:
          args: --file=package.json --package-manager=yarn --severity-threshold=high
